<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .box { padding: 16px; margin: 8px 0; border: 2px solid #10B981; }

    .hidden-none       { display: none; }
    .hidden-visibility { visibility: hidden; }
    .hidden-opacity    { opacity: 0; }
  </style>
</head>
<body>
  <div class="box">made by Ankhaa</div>
  <div class="box hidden-none">made by Ankhaa</div>
  <div class="box">made by Ankhaa</div>
  <div class="box hidden-visibility">made by Ankhaa</div>
  <div class="box">made by Ankhaa</div>
  <hr>
  <button onclick="document.getElementById('msg').style.display = document.getElementById('msg').style.display === 'none' ? 'block' : 'none'">
    Toggle Message
  </button>
  <div id="msg" class="box" style="display:none">made by Ankhaa</div>
</body>
</html>
