<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .box {
      background: #ecfdf5;
      border: 2px solid #10B981;
      padding: 12px;
      width: 280px;
    }

    .m-none  { margin: 0; }
    .m-all   { margin: 20px; }
    .m-auto  { margin: 0 auto; }
    .m-sides { margin-left: 40px; margin-right: 40px; }

    .p1 { margin-bottom: 20px; background: #fef3c7; padding: 8px; }
    .p2 { margin-top:    30px; background: #dbeafe; padding: 8px; }
  </style>
</head>
<body>
  <div class="box m-none">made by Ankhaa</div>
  <div class="box m-all">made by Ankhaa</div>
  <div class="box m-auto">made by Ankhaa</div>
  <hr>
  <p class="p1">made by Ankhaa</p>
  <p class="p2">made by Ankhaa</p>
</body>
</html>
