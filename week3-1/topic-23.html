<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    p           { color: gray; }
    .highlight  { color: blue; }
    p.highlight { color: purple; }
    #note       { color: green; }

    div p       { font-style: italic; }
    div .highlight { font-weight: bold; }
  </style>
</head>
<body>
  <p>Made by Ankhaa</p>

  <p class="highlight">made by Ankhaa</p>

  <p class="highlight" id="note">made by Ankhaa</p>
</body>
</html>
